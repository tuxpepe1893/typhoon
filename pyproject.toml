[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "typhoon-ac"
version = "0.1.0"
description = "Local Wi-Fi control for Tornado/AUX air conditioners"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "David Tatikashvili" }]
requires-python = ">=3.11"
classifiers = [
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Home Automation",
]
dependencies = [
    "broadlink==0.19.0",
    "hap-python[qrcode]==5.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6.16"]

[project.urls]
Homepage = "https://github.com/tuxpepe1893/typhoon"
Issues = "https://github.com/tuxpepe1893/typhoon/issues"

[project.scripts]
typhoon = "typhoon.cli:main"

[tool.setuptools.packages.find]
include = ["typhoon*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
